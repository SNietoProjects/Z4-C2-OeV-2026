<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Derecho Administrativo y Gestión Pública | Opositar en Valencia</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --naranja: #d97706;
    --naranja-claro: #fef3c7;
    --naranja-borde: #f59e0b;
    --azul-oscuro: #1e293b;
    --texto: #374151;
    --texto-suave: #6b7280;
    --borde: #e5e7eb;
    --fondo: #fafaf9;
    --blanco: #ffffff;
    --verde: #166534;
    --verde-bg: #f0fdf4;
    --verde-borde: #86efac;
    --rojo: #991b1b;
    --rojo-bg: #fef2f2;
    --rojo-borde: #fca5a5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  header {
    background: var(--blanco);
    border-bottom: 1px solid var(--borde);
    padding: 0;
  }
  .header-top {
    max-width: 860px;
    margin: 0 auto;
    padding: 1.4rem 1.5rem 1rem;
    display: flex;
    align-items: flex-start;
    gap: 1.2rem;
  }
  .header-logo {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .header-textos { flex: 1; }
  .header-site {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--naranja);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .header-titulo {
    font-family: 'Lora', serif;
    font-size: clamp(1.25rem, 3.5vw, 1.75rem);
    font-weight: 700;
    color: var(--azul-oscuro);
    line-height: 1.2;
  }
  .header-sub {
    font-size: 0.88rem;
    color: var(--texto-suave);
    margin-top: 4px;
  }
  .header-meta {
    background: var(--naranja-claro);
    border-top: 1px solid #fde68a;
    padding: 0.55rem 1.5rem;
  }
  .header-meta-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    font-size: 0.83rem;
    color: #92400e;
    font-weight: 500;
  }
  .header-meta-inner span::before { margin-right: 4px; }

  /* ── BARRA PROGRESO ── */
  .barra-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--blanco);
    border-bottom: 1px solid var(--borde);
    padding: 0.6rem 1.5rem;
    box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  }
  .barra-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .barra-track {
    flex: 1;
    height: 6px;
    background: #f3f4f6;
    border-radius: 99px;
    overflow: hidden;
  }
  .barra-fill {
    height: 100%;
    background: var(--naranja);
    border-radius: 99px;
    transition: width 0.35s ease;
    width: 0%;
  }
  .barra-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--azul-oscuro);
    white-space: nowrap;
    min-width: 52px;
  }
  .barra-score {
    font-size: 13px;
    color: var(--texto-suave);
    white-space: nowrap;
  }
  .barra-score .ok { color: var(--verde); font-weight: 600; }
  .barra-score .ko { color: var(--rojo); font-weight: 600; }

  /* ── MAIN ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem 5rem;
  }

  /* ── CARD PREGUNTA ── */
  .card {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 1.5rem 1.6rem;
    margin-bottom: 1.4rem;
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 3px 14px rgba(0,0,0,0.06); }

  .card-num {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--naranja);
    margin-bottom: 0.5rem;
  }
  .card-pregunta {
    font-family: 'Lora', serif;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.55;
    color: var(--azul-oscuro);
    margin-bottom: 1.1rem;
  }

  /* ── OPCIONES ── */
  .opciones { display: flex; flex-direction: column; gap: 0.45rem; }
  .opcion {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    padding: 0.7rem 1rem;
    border: 1.5px solid var(--borde);
    border-radius: 7px;
    cursor: pointer;
    background: var(--blanco);
    text-align: left;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.93rem;
    color: var(--texto);
    line-height: 1.5;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }
  .opcion:hover:not(:disabled) {
    border-color: var(--naranja-borde);
    background: var(--naranja-claro);
  }
  .opcion .letra {
    font-weight: 700;
    color: var(--naranja);
    min-width: 18px;
    font-size: 0.85rem;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .opcion.correcta {
    border-color: var(--verde-borde);
    background: var(--verde-bg);
    color: var(--verde);
  }
  .opcion.correcta .letra { color: #15803d; }
  .opcion.incorrecta {
    border-color: var(--rojo-borde);
    background: var(--rojo-bg);
    color: var(--rojo);
  }
  .opcion.incorrecta .letra { color: var(--rojo); }
  .opcion:disabled { cursor: default; }

  /* ── EXPLICACIÓN ── */
  .explicacion {
    display: none;
    margin-top: 1rem;
    padding: 0.9rem 1rem 0.9rem 1.1rem;
    background: #fffbeb;
    border-left: 3px solid var(--naranja);
    border-radius: 0 6px 6px 0;
    font-size: 0.875rem;
    line-height: 1.65;
    color: var(--texto);
  }
  .explicacion.visible { display: block; animation: fadeIn 0.22s ease; }
  .explicacion strong { color: var(--azul-oscuro); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── RESULTADO FINAL ── */
  .resultado {
    display: none;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 2.5rem 2rem 2rem;
    margin: 1.5rem 0 2rem;
    text-align: center;
  }
  .resultado.visible { display: block; animation: fadeIn 0.3s ease; }
  .resultado-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--naranja);
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .resultado h2 {
    font-family: 'Lora', serif;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--azul-oscuro);
    margin-bottom: 0.3rem;
  }
  .resultado-nota {
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--azul-oscuro);
    line-height: 1;
    margin: 1rem 0 0.3rem;
    font-family: 'Lora', serif;
  }
  .resultado-nota span { color: var(--naranja); }
  .calif-badge {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 99px;
    font-size: 0.9rem;
    font-weight: 600;
    margin: 0.6rem 0 1.5rem;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin: 0 0 1.5rem;
  }
  .stat {
    background: var(--fondo);
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 0.9rem 0.5rem;
  }
  .stat-num { font-size: 1.9rem; font-weight: 700; font-family: 'Lora', serif; }
  .stat-lab { font-size: 0.78rem; color: var(--texto-suave); margin-top: 2px; }
  .resultado-hint {
    font-size: 0.85rem;
    color: var(--texto-suave);
    margin-bottom: 1.2rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0.7rem 1.6rem;
    border-radius: 7px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.18s;
    text-decoration: none;
  }
  .btn-naranja {
    background: var(--naranja);
    color: white;
  }
  .btn-naranja:hover { background: #b45309; transform: translateY(-1px); }

  /* ── SEPARADOR ── */
  .divider {
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--texto-suave);
    margin: 2rem 0 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--borde);
  }

  @media (max-width: 580px) {
    main { padding: 1.2rem 1rem 4rem; }
    .card { padding: 1.1rem 1.1rem; }
    .stats { grid-template-columns: 1fr 1fr; }
    .header-top { padding: 1rem; gap: 0.8rem; }
    .header-meta { padding: 0.5rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <img class="header-logo"
      src="https://opositorgva.wordpress.com/wp-content/uploads/2024/04/cropped-opositar-en-valencia-logo-sin-fondo.png"
      alt="Opositar en Valencia"
      onerror="this.style.display='none'">
    <div class="header-textos">
      <div class="header-site">Opositar en Valencia · GVA</div>
      <div class="header-titulo">Bloque: Derecho Administrativo y Gestión Pública</div>
      <div class="header-sub">Temario específico · Ley 39/2015 LPAC · Ley 40/2015 LRJSP · Ley 9/2017 LCSP</div>
    </div>
  </div>
  <div class="header-meta">
    <div class="header-meta-inner">
      <span>📋 50 preguntas (de un banco de 309)</span>
      <span>🎯 Nivel medio-alto</span>
      <span>🔀 Selección y orden aleatorios en cada carga</span>
      <span>✅ Explicación en cada respuesta</span>
    </div>
  </div>
</header>

<div class="barra-wrap">
  <div class="barra-inner">
    <div class="barra-track"><div class="barra-fill" id="barraFill"></div></div>
    <span class="barra-num" id="barraNum">0 / 50</span>
    <span class="barra-score"><span class="ok" id="scoreOk">✓ 0</span> &nbsp;<span class="ko" id="scoreKo">✗ 0</span></span>
  </div>
</div>

<main id="mainContent"></main>

<script>
const BANCO_COMPLETO = [
  {
    "p": "El artículo 1.1 de la Ley 39/2015 establece el objeto de la ley. ¿Qué procedimientos incluye expresamente además del procedimiento administrativo común?",
    "ops": [
      "Solo el procedimiento de elaboración de disposiciones generales",
      "El procedimiento sancionador y el de reclamación de responsabilidad de las Administraciones Públicas",
      "El procedimiento de revisión de oficio y el de ejecución forzosa",
      "El procedimiento de contratación pública y el de gestión de subvenciones"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 1.1 LPAC establece que la ley regula «el procedimiento administrativo común a todas las Administraciones Públicas, incluyendo el sancionador y el de reclamación de responsabilidad de las Administraciones Públicas, así como los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria».",
    "tema": "B1"
  },
  {
    "p": "El artículo 1.2 de la Ley 39/2015 establece límites a la inclusión de trámites adicionales en el procedimiento. ¿Mediante qué instrumento normativo y bajo qué condiciones puede hacerse?",
    "ops": [
      "Mediante reglamento, siempre que se justifique por razones de urgencia",
      "Solo mediante ley, cuando resulte eficaz, proporcionado y necesario para los fines del procedimiento, y de manera motivada",
      "Mediante orden ministerial, con autorización previa del Consejo de Estado",
      "Mediante cualquier norma con rango de ley o reglamento, sin más condiciones"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 1.2 LPAC establece que «sólo mediante ley, cuando resulte eficaz, proporcionado y necesario para la consecución de los fines propios del procedimiento, y de manera motivada, podrán incluirse trámites adicionales o distintos a los contemplados en esta Ley». Por reglamento solo caben especialidades menores (órganos, plazos, formas de iniciación).",
    "tema": "B1"
  },
  {
    "p": "El artículo 2.2 de la Ley 39/2015 define el sector público institucional. ¿Cómo trata a las entidades de derecho privado vinculadas a las Administraciones Públicas?",
    "ops": [
      "Quedan excluidas totalmente del ámbito de aplicación de la ley",
      "Quedan sujetas a las normas de la ley que específicamente se refieran a ellas, y en todo caso cuando ejerzan potestades administrativas",
      "Quedan sujetas a la ley en su totalidad, igual que la Administración General del Estado",
      "Quedan sujetas únicamente a la legislación mercantil, sin aplicación de la LPAC"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 2.2.b) LPAC establece que las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas «quedarán sujetas a lo dispuesto en las normas de esta Ley que específicamente se refieran a las mismas, y en todo caso, cuando ejerzan potestades administrativas».",
    "tema": "B1"
  },
  {
    "p": "El artículo 2.3 de la Ley 39/2015 define qué entidades tienen la consideración de «Administraciones Públicas». ¿Cuáles son?",
    "ops": [
      "Todas las entidades del sector público institucional, incluidas las sociedades mercantiles públicas",
      "La AGE, las Administraciones autonómicas, las Entidades Locales, y los organismos públicos y entidades de derecho público del art. 2.2.a)",
      "Únicamente la Administración General del Estado y las Comunidades Autónomas",
      "Todas las personas jurídicas, públicas o privadas, que reciban financiación pública mayoritaria"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 2.3 LPAC establece que tienen la consideración de Administraciones Públicas «la Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local, así como los organismos públicos y entidades de derecho público previstos en la letra a) del apartado 2 anterior». No incluye las entidades de derecho privado ni las Universidades.",
    "tema": "B1"
  },
  {
    "p": "El artículo 3.b) de la Ley 39/2015 reconoce capacidad de obrar a los menores de edad. ¿En qué supuesto se exceptúa esta capacidad?",
    "ops": [
      "Cuando el menor tenga menos de catorce años de edad",
      "Cuando se trate de menores incapacitados, si la extensión de la incapacitación afecta al ejercicio y defensa de los derechos o intereses de que se trate",
      "Cuando el procedimiento tenga carácter sancionador, en cuyo caso siempre se requiere representación",
      "Cuando el menor no esté emancipado, salvo autorización judicial expresa"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 3.b) LPAC reconoce capacidad de obrar a «los menores de edad para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela. Se exceptúa el supuesto de los menores incapacitados, cuando la extensión de la incapacitación afecte al ejercicio y defensa de los derechos o intereses de que se trate».",
    "tema": "B1"
  },
  {
    "p": "El artículo 4.1 de la Ley 39/2015 enumera quiénes se consideran interesados en el procedimiento administrativo. ¿Cuál de las siguientes categorías SÍ figura expresamente?",
    "ops": [
      "Quienes promuevan el procedimiento como titulares de derechos o intereses legítimos individuales o colectivos",
      "Solo quienes hayan iniciado formalmente el procedimiento mediante solicitud escrita",
      "Únicamente las personas físicas, excluyendo a las personas jurídicas",
      "Solo quienes acrediten un interés económico directo cuantificable"
    ],
    "c": 0,
    "exp": "<strong>Respuesta correcta: A.</strong> El art. 4.1.a) LPAC reconoce como interesados a «quienes lo promuevan como titulares de derechos o intereses legítimos individuales o colectivos». Las otras dos categorías son: quienes sin haber iniciado el procedimiento tengan derechos que puedan resultar afectados (b), y quienes se personen porque sus intereses legítimos puedan verse afectados (c).",
    "tema": "B1"
  },
  {
    "p": "El artículo 4.3 de la Ley 39/2015 regula la sucesión en la condición de interesado. ¿Qué establece cuando dicha condición deriva de una relación jurídica transmisible?",
    "ops": [
      "La condición de interesado se extingue automáticamente, debiendo el sucesor iniciar un nuevo procedimiento",
      "El derecho-habiente sucederá en tal condición cualquiera que sea el estado del procedimiento",
      "La sucesión solo es posible antes de que se dicte la resolución de inicio del procedimiento",
      "El sucesor debe acreditar judicialmente su condición antes de poder personarse en el procedimiento"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 4.3 LPAC establece que «cuando la condición de interesado derivase de alguna relación jurídica transmisible, el derecho-habiente sucederá en tal condición cualquiera que sea el estado del procedimiento». No hay límite temporal: la sucesión opera en cualquier fase del procedimiento.",
    "tema": "B1"
  },
  {
    "p": "El artículo 5.6 de la Ley 39/2015 regula la falta o insuficiente acreditación de la representación. ¿Qué consecuencia tiene y qué plazo de subsanación se concede?",
    "ops": [
      "El acto se considera nulo de pleno derecho sin posibilidad de subsanación",
      "No impedirá que se tenga por realizado el acto, siempre que se subsane el defecto en el plazo de diez días (o superior si las circunstancias lo requieren)",
      "El acto queda automáticamente anulado, debiendo iniciarse un nuevo procedimiento",
      "Se concede un plazo de quince días improrrogables para subsanar el defecto"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 5.6 LPAC establece que «la falta o insuficiente acreditación de la representación no impedirá que se tenga por realizado el acto de que se trate, siempre que se aporte aquélla o se subsane el defecto dentro del plazo de diez días que deberá conceder al efecto el órgano administrativo, o de un plazo superior cuando las circunstancias del caso así lo requieran».",
    "tema": "B1"
  },
  {
    "p": "El artículo 6.6 de la Ley 39/2015 regula la validez temporal de los poderes inscritos en el registro electrónico de apoderamientos. ¿Cuál es su duración máxima?",
    "ops": [
      "Tres años desde la fecha de inscripción, sin posibilidad de prórroga",
      "Cinco años a contar desde la fecha de inscripción, prorrogable por el poderdante antes de su finalización",
      "Indefinida, mientras el poderdante no la revoque expresamente",
      "Dos años, renovables automáticamente salvo revocación expresa"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 6.6 LPAC establece que «los poderes inscritos en el registro tendrán una validez determinada máxima de cinco años a contar desde la fecha de inscripción. En todo caso, en cualquier momento antes de la finalización de dicho plazo el poderdante podrá revocar o prorrogar el poder». Las prórrogas tienen igualmente una validez máxima de cinco años.",
    "tema": "B1"
  },
  {
    "p": "El artículo 8 de la Ley 39/2015 regula la aparición de nuevos interesados durante la instrucción de un procedimiento. ¿En qué supuesto se les debe comunicar la tramitación?",
    "ops": [
      "Siempre que se advierta su existencia, sin más condiciones",
      "Si el procedimiento no ha tenido publicidad, se advierte la existencia de titulares de derechos o intereses legítimos y directos identificables en el expediente, que puedan resultar afectados por la resolución",
      "Únicamente cuando lo solicite expresamente el interesado original del procedimiento",
      "Solo en los procedimientos sancionadores, no en los de naturaleza favorable al interesado"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 8 LPAC establece que «si durante la instrucción de un procedimiento que no haya tenido publicidad, se advierte la existencia de personas que sean titulares de derechos o intereses legítimos y directos cuya identificación resulte del expediente y que puedan resultar afectados por la resolución que se dicte, se comunicará a dichas personas la tramitación del procedimiento».",
    "tema": "B1"
  },
  {
    "p": "El artículo 9.2.c) de la Ley 39/2015 regula otros sistemas de identificación electrónica distintos de los certificados cualificados. ¿Qué plazo debe transcurrir desde la comunicación a la Secretaría General de Administración Digital antes de su eficacia jurídica?",
    "ops": [
      "Un mes desde la comunicación",
      "Dos meses desde dicha comunicación, durante los cuales el órgano estatal competente podrá acudir a la vía jurisdiccional por motivos de seguridad pública",
      "Quince días hábiles desde la comunicación",
      "Tres meses, ampliable a seis en casos de especial complejidad técnica"
    ],
    "c": 1,
    "exp": "<strong>Respuesta correcta: B.</strong> El art. 9.2.c) LPAC establece que «de forma previa a la eficacia jurídica del sistema, habrán de transcurrir dos meses desde dicha comunicación, durante los cuales el órgano estatal competente por motivos de seguridad pública podrá acudir a la vía jurisdiccional, previo informe vinculante de la Secretaría de Estado de Seguridad, que deberá emitir en el plazo de diez días desde su solicitud».",
    "tema": "B1"
  },
  {

    "exp": "<strong>Respuesta correcta: B.</strong> La diferencia fundamental es el riesgo operacional: en el contrato de servicios ordinario (art. 17), la Administración paga un precio al contratista, que no asume riesgo de demanda ni de suministro; si los usuarios no demandan el servicio, la Administración paga igual. En la concesión de servicios (art. 15), la contraprestación es el derecho a explotar el servicio (con o sin precio complementario), y esa explotación «implicará la transferencia al concesionario del riesgo operacional» (art. 15.2). Si no hay transferencia efectiva del riesgo, el contrato no es concesión de servicios sino contrato de servicios ordinario.",
    "tema": "B4"
  }
];

// ── ALEATORIZACIÓN ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Tamaño del test que se muestra en cada carga (selección sobre el banco combinado)
const TAMANO_TEST = 50;

// Nombres cortos de cada tema, usados como etiqueta en cada tarjeta
const TEMAS_NOMBRE = {
  B1: 'Tema Esp. 1 (LPAC, Tít. Prel-II)',
  B2: 'Tema Esp. 2 (LPAC, Tít. IV-V)',
  B3: 'Tema Esp. 3 (LRJSP)',
  B4: 'Tema Esp. 4 (LCSP)'
};

// Cada pregunta lleva track de su respuesta correcta original (índice en ops original)
// Al barajar las ops, hay que recalcular el índice correcto nuevo
function prepararPreguntas() {
  const seleccionadas = shuffle(BANCO_COMPLETO).slice(0, Math.min(TAMANO_TEST, BANCO_COMPLETO.length));
  const mezcladas = shuffle(seleccionadas);
  return mezcladas.map(q => {
    const respuestaTextoCorrecta = q.ops[q.c];
    const opsNuevas = shuffle(q.ops);
    const nuevoC = opsNuevas.indexOf(respuestaTextoCorrecta);
    return { p: q.p, ops: opsNuevas, c: nuevoC, exp: q.exp, tema: q.tema };
  });
}

let preguntas = [];
let respondidas = 0, correctas = 0, incorrectas = 0;

function actualizarBarra() {
  const pct = preguntas.length ? (respondidas / preguntas.length) * 100 : 0;
  document.getElementById('barraFill').style.width = pct + '%';
  document.getElementById('barraNum').textContent = respondidas + ' / ' + preguntas.length;
  document.getElementById('scoreOk').textContent = '✓ ' + correctas;
  document.getElementById('scoreKo').textContent = '✗ ' + incorrectas;
}

function responder(qi, oi) {
  const q = preguntas[qi];
  const btns = document.querySelectorAll('[data-qi="' + qi + '"]');
  btns.forEach(b => b.disabled = true);
  btns.forEach((b, j) => {
    if (j === q.c) b.classList.add('correcta');
    else if (j === oi && oi !== q.c) b.classList.add('incorrecta');
  });
  document.getElementById('exp-' + qi).classList.add('visible');
  respondidas++;
  if (oi === q.c) correctas++; else incorrectas++;
  actualizarBarra();
  if (respondidas === preguntas.length) setTimeout(mostrarResultado, 700);
}

function mostrarResultado() {
  const pct = Math.round((correctas / preguntas.length) * 100);
  document.getElementById('resPunt').innerHTML = correctas + ' <span>/ ' + preguntas.length + '</span>';
  document.getElementById('resCorr').textContent = correctas;
  document.getElementById('resIncorr').textContent = incorrectas;
  document.getElementById('resPct').textContent = pct + '%';

  let txt, col, bg;
  if (pct >= 90)      { txt = '🏆 Sobresaliente'; col = '#166534'; bg = '#f0fdf4'; }
  else if (pct >= 75) { txt = '✅ Notable';        col = '#1e3a5f'; bg = '#eff6ff'; }
  else if (pct >= 60) { txt = '📘 Aprobado';       col = '#92400e'; bg = '#fffbeb'; }
  else                { txt = '❌ Insuficiente — ¡Sigue practicando!'; col = '#991b1b'; bg = '#fef2f2'; }

  document.getElementById('resCalif').innerHTML =
    '<span class="calif-badge" style="background:' + bg + ';color:' + col + '">' + txt + '</span>';

  const el = document.getElementById('resultado');
  el.classList.add('visible');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function render() {
  respondidas = 0; correctas = 0; incorrectas = 0;
  preguntas = prepararPreguntas();
  actualizarBarra();

  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  const letras = ['A','B','C','D'];

  preguntas.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'card';

    const opsHTML = q.ops.map((op, j) =>
      `<button class="opcion" data-qi="${i}" onclick="responder(${i},${j})">
        <span class="letra">${letras[j]})</span><span>${op}</span>
      </button>`
    ).join('');

    card.innerHTML =
      `<div class="card-num">Pregunta ${i + 1} de ${preguntas.length} · ${TEMAS_NOMBRE[q.tema]}</div>
       <div class="card-pregunta">${q.p}</div>
       <div class="opciones">${opsHTML}</div>
       <div class="explicacion" id="exp-${i}">${q.exp}</div>`;

    main.appendChild(card);
  });

  // Separador y resultado final
  const sep = document.createElement('div');
  sep.className = 'divider';
  sep.textContent = 'Fin del test';
  main.appendChild(sep);

  const res = document.createElement('div');
  res.className = 'resultado';
  res.id = 'resultado';
  res.innerHTML =
    `<div class="resultado-eyebrow">Resultado final</div>
     <h2>Test completado</h2>
     <div class="resultado-nota" id="resPunt">0 <span>/ ${preguntas.length}</span></div>
     <div id="resCalif"></div>
     <div class="stats">
       <div class="stat"><div class="stat-num" id="resCorr" style="color:#166534">0</div><div class="stat-lab">Correctas</div></div>
       <div class="stat"><div class="stat-num" id="resIncorr" style="color:#991b1b">0</div><div class="stat-lab">Incorrectas</div></div>
       <div class="stat"><div class="stat-num" id="resPct">0%</div><div class="stat-lab">% aciertos</div></div>
     </div>
     <p class="resultado-hint">Desplázate hacia arriba para revisar las explicaciones de cada pregunta.</p>
     <button class="btn btn-naranja" onclick="render(); window.scrollTo({top:0,behavior:'smooth'})">↺ Repetir con nuevo orden</button>`;
  main.appendChild(res);
}

render();
</script>
